<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
        .log { background: #f5f5f5; padding: 10px; height: 200px; overflow-y: auto; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Study Room WebSocket Test</h1>
        
        <div class="section">
            <h3>Connection Status</h3>
            <div id="status">Disconnected</div>
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div class="section">
            <h3>Create Room</h3>
            <input type="text" id="userName" placeholder="Your Name" value="Test User">
            <input type="number" id="maxCapacity" placeholder="Max Capacity" value="5" min="2" max="10">
            <button onclick="createRoom()">Create Room</button>
        </div>

        <div class="section">
            <h3>Join Room</h3>
            <input type="text" id="joinRoomCode" placeholder="Room Code">
            <input type="text" id="joinUserName" placeholder="Your Name" value="Test User 2">
            <input type="text" id="joinUserId" placeholder="User ID" value="test-user-123">
            <button onclick="joinRoom()">Join Room</button>
        </div>

        <div class="section">
            <h3>Room Actions</h3>
            <button onclick="leaveRoom()">Leave Room</button>
        </div>

        <div class="section">
            <h3>Log</h3>
            <div id="log" class="log"></div>
            <button onclick="clearLog()">Clear Log</button>
        </div>
    </div>

    <script>
        let socket = null;
        let currentRoom = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }

        function connect() {
            if (socket) {
                log('Already connected', 'info');
                return;
            }

            socket = io('http://localhost:3001');

            socket.on('connect', () => {
                log('Connected to server', 'success');
                updateStatus('Connected');
            });

            socket.on('disconnect', () => {
                log('Disconnected from server', 'error');
                updateStatus('Disconnected');
            });

            socket.on('room-created', (data) => {
                log(`Room created: ${data.roomCode}`, 'success');
                log(`Room ID: ${data.roomId}`, 'info');
                log(`Attendees: ${data.room.attendees.length}`, 'info');
                currentRoom = data.roomId;
            });

            socket.on('room-joined', (data) => {
                log(`Joined room: ${data.room.code}`, 'success');
                log(`Attendees: ${data.room.attendees.length}`, 'info');
                currentRoom = data.roomId;
            });

            socket.on('user-joined', (data) => {
                log(`${data.userName} joined the room`, 'info');
                log(`Total attendees: ${data.attendees.length}`, 'info');
            });

            socket.on('user-left', (data) => {
                log(`${data.userName} left the room`, 'info');
                log(`Total attendees: ${data.attendees.length}`, 'info');
            });

            socket.on('room-left', () => {
                log('Left the room', 'info');
                currentRoom = null;
            });

            socket.on('session-ended', (data) => {
                log(`Session ended: ${data.message}`, 'error');
                log(`Reason: ${data.reason}`, 'info');
                currentRoom = null;
            });

            socket.on('error', (data) => {
                log(`Error: ${data.message}`, 'error');
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                updateStatus('Disconnected');
                log('Disconnected', 'info');
            }
        }

        function createRoom() {
            if (!socket) {
                log('Please connect first', 'error');
                return;
            }

            const userName = document.getElementById('userName').value;
            const maxCapacity = parseInt(document.getElementById('maxCapacity').value);

            if (!userName) {
                log('Please enter your name', 'error');
                return;
            }

            socket.emit('create-room', {
                userId: 'test-user-123',
                userName: userName,
                maxCapacity: maxCapacity
            });

            log(`Creating room with capacity: ${maxCapacity}`, 'info');
        }

        function joinRoom() {
            if (!socket) {
                log('Please connect first', 'error');
                return;
            }

            const roomCode = document.getElementById('joinRoomCode').value;
            const userName = document.getElementById('joinUserName').value;
            const userId = document.getElementById('joinUserId').value;

            if (!roomCode || !userName || !userId) {
                log('Please enter room code, your name, and user ID', 'error');
                return;
            }
            
            console.log('=== JOIN ROOM DEBUG ===');
            console.log('Room Code:', roomCode);
            console.log('User Name:', userName);
            console.log('User ID:', userId);
            console.log('========================');

            socket.emit('join-room', {
                roomCode: roomCode.toUpperCase(),
                userId: userId,
                userName: userName
            });

            log(`Joining room: ${roomCode} with user ID: ${userId}`, 'info');
        }

        function leaveRoom() {
            if (!socket) {
                log('Please connect first', 'error');
                return;
            }

            if (!currentRoom) {
                log('Not in any room', 'error');
                return;
            }

            socket.emit('leave-room');
            log('Leaving room...', 'info');
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Auto-connect on page load
        window.onload = () => {
            log('Page loaded. Click Connect to start testing.', 'info');
        };
    </script>
</body>
</html>
